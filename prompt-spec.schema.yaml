$schema: "http://json-schema.org/draft-07/schema#"
title: "Prompt Specification Schema"
description: "Schema for describing a prompt to execute a PowerShell script for scaffolding a .NET Clean Architecture solution."
type: object
required:
  - SchemaVersion
  - PromptVersion
  - author
  - considerations
  - tags
  - metadata
  - examples
  - prerequisites
  - name
  - description
  - parameters
  - steps
  - outputs
properties:
  SchemaVersion:
    type: integer
    description: "Version number of the schema specification."
  PromptVersion:
    type: integer
    description: "Version number of the prompt specification."
  author:
    type: string
    description: "Author or organization responsible for the prompt."
  tags:
    type: array
    items:
      type: string
    description: "Tags for categorizing the prompt."
  metadata:
    type: string
    description: "Additional metadata describing the prompt's purpose or behavior."
  examples:
    type: array
    items:
      type: string
    description: "Example use cases for the prompt."
  prerequisites:
    type: array
    items:
      type: string
    description: "Additional notes or requirements for running the script."
  name:
    type: string
    description: "The name of the prompt or script."
  description:
    type: string
    description: "A detailed description of the prompt and its purpose."
  parameters:
    type: array
    items:
      type: object
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: "Parameter name."
        type:
          type: string
          description: "Parameter data type (e.g., string, integer)."
        default:
          type: [string, number, boolean]
          description: "Default value for the parameter."
        description:
          type: string
          description: "Description of the parameter."
    description: "List of parameters accepted by the script."
  steps:
    type: array
    items:
      type: object
      required:
        - description
        - command
      properties:
        description:
          type: string
          description: "Description of the step."
        command:
          type: string
          description: "Command to execute for the step."
    description: "Steps to execute the script."
  outputs:
    type: array
    items:
      type: object
      properties:
        description:
          type: string
          description: "Description of the output."
        files:
          type: array
          items:
            type: string
          description: "List of files generated by the script."
      additionalProperties: false
    description: "Expected outputs from the script execution."
additionalProperties: false